worker_processes 1;
events { worker_connections 1024; }

http {
    default_type  application/octet-stream;
    server_tokens off;

    # Rate-limiting zones keyed by client IP
    limit_req_zone $binary_remote_addr zone=chat:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;

    upstream lexchat {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options        "DENY"                            always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        client_max_body_size 2m;

        # Drop known scanner probe paths with no response
        location ~* ^/(SDK|\.env|\.git|wp-admin|wp-login|phpmyadmin) {
            return 444;
        }

        # LLM chat endpoint — rate-limited (6 req/min per IP, burst 3)
        location ~ ^/api/chats/[0-9]+/messages$ {
            limit_req        zone=chat burst=3 nodelay;
            limit_req_status 429;

            proxy_pass            http://lexchat;
            proxy_http_version    1.1;
            proxy_set_header      Connection        '';
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_buffering       off;
            proxy_cache           off;
            proxy_read_timeout    600s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
        }

        # Other API endpoints — rate-limited (60 req/min per IP, burst 20)
        location /api/ {
            limit_req        zone=api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass            http://lexchat;
            proxy_http_version    1.1;
            proxy_set_header      Connection        '';
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_buffering       off;
            proxy_cache           off;
            proxy_read_timeout    600s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
        }

        location / {
            proxy_pass            http://lexchat;
            proxy_http_version    1.1;
            proxy_set_header      Connection        '';
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_buffering       off;
            proxy_cache           off;
            proxy_read_timeout    600s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
        }
    }
}

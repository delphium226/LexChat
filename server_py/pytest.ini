[pytest]
# The test engine and the session-scoped setup_db fixture open asyncpg
# connections that are bound to the event loop they were created on. asyncpg
# connections cannot be awaited from a different loop, so every fixture and
# test must share ONE loop — otherwise pytest-asyncio's default per-function
# loop raises "attached to a different loop". Pin both to session scope.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

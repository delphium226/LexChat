version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: lexuser
      POSTGRES_PASSWORD: lexpassword
      POSTGRES_DB: lexchat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lexuser -d lexchat" ]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    restart: always
    environment:
      - OLLAMA_API_KEY=535d61a8291a4c90b3180937cadb07a0.WLwUVnMulqxma4JwZec9ix88
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama_auth/id_ed25519:/tmp/ollama_id_ed25519:ro
      - ./ollama_auth/id_ed25519.pub:/tmp/ollama_id_ed25519.pub:ro
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        mkdir -p /root/.ollama
        cp /tmp/ollama_id_ed25519 /root/.ollama/id_ed25519
        chmod 600 /root/.ollama/id_ed25519
        cp /tmp/ollama_id_ed25519.pub /root/.ollama/id_ed25519.pub
        exec ollama serve
    ports:
      - "11434:11434"

  ollama-puller:
    image: curlimages/curl
    restart: "no"
    depends_on:
      - ollama
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Waiting for Ollama..."
        while ! curl -s http://ollama:11434/ > /dev/null; do sleep 2; done
        echo "Ollama is ready. Pulling models..."
        curl -X POST http://ollama:11434/api/pull -d '{"name": "mistral-large-3:675b-cloud"}'
        curl -X POST http://ollama:11434/api/pull -d '{"name": "cogito-2.1:671b-cloud"}'
        curl -X POST http://ollama:11434/api/pull -d '{"name": "kimi-k2-thinking:cloud"}'
        curl -X POST http://ollama:11434/api/pull -d '{"name": "minimax-m2:cloud"}'
        curl -X POST http://ollama:11434/api/pull -d '{"name": "deepseek-v3.2:cloud"}'
        curl -X POST http://ollama:11434/api/pull -d '{"name": "glm-4.6:cloud"}'
        echo "All models pull requests initiated."

  app:
    build: .
    restart: always
    ports:
      - "80:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://lexuser:lexpassword@db:5432/lexchat
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_API_KEY= # Unset to allow Ollama container to handle auth via SSH keys
      - JWT_SECRET=docker_default_jwt_secret
      - MAX_CONCURRENT_REQUESTS=1
      # LEX_API_URL is picked up from .env if present, or defaults.
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
